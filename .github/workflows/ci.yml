name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Exercise the lowest Node.js version supported by package.json.
          node-version: 18

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check source
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Validate built package and subpath exports
        run: bun run test:package

      - name: Verify packed publish contents
        shell: bash
        run: |
          package_tarball="$PWD/$(npm pack --ignore-scripts --silent)"
          consumer_directory="$(mktemp -d)"
          trap 'rm -rf "$package_tarball" "$consumer_directory"' EXIT

          if tar -tzf "$package_tarball" | grep --quiet '^package/examples/'; then
            echo "Runnable examples belong in the repository, not the published tarball."
            exit 1
          fi

          (
            cd "$consumer_directory"
            npm init --yes --silent
            npm install --ignore-scripts --no-audit --no-fund "$package_tarball"
            node --input-type=module --eval 'await Promise.all(["", "/webhooks", "/fetch", "/nextjs", "/express", "/fastify", "/hono"].map((entrypoint) => import(`oxapay-ts${entrypoint}`)))'
          )

  framework-examples:
    name: Framework example (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Express
            path: examples/webhooks/express
            next_build: false
            runtime_example: express
          - name: Fastify
            path: examples/webhooks/fastify
            next_build: false
            runtime_example: fastify
          - name: Hono
            path: examples/webhooks/hono
            next_build: false
            runtime_example: hono
          - name: Next.js App Router
            path: examples/webhooks/nextjs-app-router
            next_build: true
            runtime_example: nextjs-app-router

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install SDK build dependencies
        run: bun install --frozen-lockfile

      - name: Build the SDK for the local file dependency
        run: |
          bun run build
          test -f dist/index.js
          test -f dist/index.d.mts

      - name: Install declared example dependencies
        run: npm install --prefix "${{ matrix.path }}" --no-package-lock --no-audit --fund=false

      - name: Type-check the example
        run: npm run check --prefix "${{ matrix.path }}"

      - name: Build the Next.js example
        if: matrix.next_build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OXAPAY_MERCHANT_API_KEY: ci-placeholder
        run: npm run build --prefix "${{ matrix.path }}"

      - name: Deliver signed webhooks through the example source
        env:
          OXAPAY_TEST_EXAMPLE: ${{ matrix.runtime_example }}
        run: bun test ./tests/webhook-example-integration.ts
